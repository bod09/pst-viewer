# Included from every location block that sets its own add_header (nginx
# discards inherited add_header directives in that case).
#
# The CSP limits page scripts to this origin: no third-party code, no requests
# to other servers. The one exception is images referenced by opened emails
# (img-src https: http:); remove those two tokens to block them as well.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
