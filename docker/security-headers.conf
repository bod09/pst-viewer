# Security headers, included from every location block that sets its own
# add_header (nginx drops inherited add_header directives in that case).
#
# The Content-Security-Policy is the "trust, but verify" part of the app's
# privacy promise: the browser itself blocks page scripts from talking to any
# other server (connect-src 'self') and from loading third-party code
# (script-src 'self'). The only remote fetches allowed at all are images
# referenced by emails you open (img-src https: http:), matching the app's
# remote-image feature; block those too by removing the https:/http: tokens.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
