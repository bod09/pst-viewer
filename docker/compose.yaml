services:
  pst-viewer:
    image: ghcr.io/bod09/pst-viewer:latest
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m   # nginx pid file and temp buffers
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    restart: unless-stopped
