server {
    # 8080: the unprivileged base image runs as non-root, which cannot bind 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Compress the text assets in transit. eng.traineddata.gz is unaffected
    # (it is served as a plain binary file, which is what the app expects).
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/wasm application/manifest+json;

    # Vite emits content-hashed files under /assets - safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .mjs, and module workers (pdf.js)
    # refuse to run scripts served as application/octet-stream.
    location ~ \.mjs$ {
        include /etc/nginx/security-headers.conf;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell and service worker must always revalidate, or PWA clients
    # would be slow to pick up new deployments.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    # No security-headers include here: a CSP on the service worker script
    # would also govern fetches made *inside* the worker, and the runtime
    # cache for remote email images (opened emails only) does cross-origin
    # fetches there. Page code stays fully constrained by the CSP above.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
