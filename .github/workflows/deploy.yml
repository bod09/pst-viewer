name: Deploy to GitHub Pages

on:
  # Called by CI (ci.yml) for a push to main, after every test has passed and
  # only when something that is published changed. It does not run on a push
  # by itself any more, so a commit that fails its tests is never published.
  workflow_call:
  # And by hand, from the Actions tab, whenever it is wanted.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (GitHub Pages subpath)
        run: npm run build
        env:
          # Project site is served from https://<user>.github.io/pst-viewer/
          # Change this if you rename the repo or use a custom domain (then '/').
          BASE_PATH: /pst-viewer/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
