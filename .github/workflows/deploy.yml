name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Nothing in these ends up in what is published, so a change to them
    # alone needs no new build. (Run it by hand from the Actions tab if ever
    # needed: workflow_dispatch below is not filtered.)
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - 'samples/**'
      - 'screenshots/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (GitHub Pages subpath)
        run: npm run build
        env:
          # Project site is served from https://<user>.github.io/pst-viewer/
          # Change this if you rename the repo or use a custom domain (then '/').
          BASE_PATH: /pst-viewer/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
