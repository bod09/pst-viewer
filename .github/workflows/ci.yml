name: CI

# Every pull request (Dependabot's included) and every push to main is
# type-checked, linted, tested and built here, and driven in a real browser.
# The `build` job at the end is the one branch protection requires, so a pull
# request can only be merged, or auto-merged, once all of it has passed.
#
# A change that touches nothing but documentation skips the tests (see the
# `changes` job). The workflow itself still has to run for those: branch
# protection waits for `build`, and a workflow filtered out by path would
# never report it, leaving the pull request stuck.
#
# On a push to main, once `build` has passed, the site and the Docker image
# are published from here (the last two jobs), so nothing that fails its
# tests is ever published.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Pushes
# to main each get their own group (the commit), so none is cancelled or
# left waiting behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Decides whether the tests need to run. They do unless every changed file
  # is documentation, and they do whenever that cannot be worked out.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # On a pull request the checkout is a merge of the branch into its
          # target, so its first parent is the target and the difference is
          # the pull request. On a push it is everything since the last push.
          if [ "$EVENT" = "pull_request" ]; then from="HEAD^1"; else from="$BEFORE"; fi
          code=true
          publish=true
          if files=$(git diff --name-only "$from" HEAD 2>/dev/null) && [ -n "$files" ]; then
            echo "$files"
            # Documentation: Markdown, the screenshots, and the license. Not
            # samples/, even its README: a test pins down what that holds.
            docs='\.md$|^screenshots/|^LICENSE$'
            code_files=$(printf '%s\n' "$files" | grep -vE "$docs" || true)
            sample_files=$(printf '%s\n' "$files" | grep -E '^samples/' || true)
            if [ -z "$code_files" ] && [ -z "$sample_files" ]; then code=false; fi
            # What is published is the built app. Documentation, tests,
            # samples and screenshots are not part of it.
            unpublished='\.md$|^tests/|^samples/|^screenshots/|^LICENSE$'
            published_files=$(printf '%s\n' "$files" | grep -vE "$unpublished" || true)
            if [ -z "$published_files" ]; then publish=false; fi
          fi
          echo "code=$code publish=$publish"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      # A link to an AI chat or coding session must never be published here:
      # the session holds the whole conversation behind the change. Tools add
      # such links to commit messages and pull request text by themselves, so
      # this fails the build if one is found (see AGENTS.md).
      - name: No links to private sessions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="HEAD^1..HEAD^2"; else range="$BEFORE..HEAD"; fi
          messages=$(git log --format=%B "$range" 2>/dev/null || git log -1 --format=%B)
          links='claude\.ai/|chatgpt\.com/|chat\.openai\.com/|gemini\.google\.com/app/'
          found=0
          if printf '%s\n' "$messages" | grep -qiE "$links"; then
            echo "::error::A commit message links to an AI session. Rewrite the commit without it."
            found=1
          fi
          # The title and description as they are now, not as they were when
          # the run was first triggered, so that re-running this job after
          # fixing the description passes.
          text=""
          if [ -n "$PR" ]; then
            text=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.title + "\n" + (.body // "")')
          fi
          if printf '%s\n' "$text" | grep -qiE "$links"; then
            echo "::error::The pull request title or description links to an AI session. Remove it, then delete the old revision from the description's edit history."
            found=1
          fi
          exit $found

  checks:
    name: Type-check, lint, tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real .pst, .ost and .msg files for the tests: public, pinned and
      # checked by hash (tests/public-mailboxes.json). Kept between runs, and
      # saved as soon as they are fetched so a failing run keeps them too.
      - uses: actions/cache/restore@v6
        id: public-files
        with:
          path: fixtures/public
          key: public-test-files-${{ hashFiles('tests/public-mailboxes.json') }}
      - run: npm run mailboxes
      - uses: actions/cache/save@v6
        if: steps.public-files.outputs.cache-hit != 'true'
        with:
          path: fixtures/public
          key: public-test-files-${{ hashFiles('tests/public-mailboxes.json') }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      # A skipped test is reported as success by the test runner. Not here.
      - run: node scripts/check-test-reports.mjs vitest
      - run: npm run build

  e2e:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Restored only: the other job saves this cache, and two jobs saving the
      # same key at once just race.
      - uses: actions/cache/restore@v6
        with:
          path: fixtures/public
          key: public-test-files-${{ hashFiles('tests/public-mailboxes.json') }}
      - run: npm run mailboxes
      # The browser itself is a large download, so it is kept between runs
      # and fetched again only when the Playwright version changes.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - uses: actions/cache/save@v6
        if: steps.browser.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - run: node scripts/check-test-reports.mjs playwright
      # What the tests saw: for a failure, a screenshot and a trace that
      # replays it step by step (https://trace.playwright.dev). Kept for
      # every run, since a test that passed only on its second try is worth
      # looking at too. Only made-up and public test mail is ever on screen.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # Branch protection requires a check called `build`, which is what this
  # workflow's only job used to be called. It is kept as the single gate so
  # the setting never has to change when jobs are added: it passes only if
  # every job listed in `needs` did, so a new job must be added to that list.
  # (Without `if: always()` it would be skipped when one failed, and GitHub
  # treats a skipped required check as passed.)
  build:
    name: build
    if: always()
    needs: [changes, checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS: ${{ needs.checks.result }} ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES (code changed: $CODE), tests: $TESTS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Could not work out what changed ($CHANGES)."
            exit 1
          fi
          # Only documentation changed: the tests were skipped on purpose,
          # and skipped is the only thing they are allowed to be.
          if [ "$CODE" = "false" ]; then want=skipped; else want=success; fi
          for result in $TESTS; do
            if [ "$result" != "$want" ]; then
              echo "::error::A CI job did not pass ($result, expected $want). See the jobs above."
              exit 1
            fi
          done
          if [ "$(echo $TESTS | wc -w)" -ne 2 ]; then
            echo "::error::Expected two job results, got: $TESTS"
            exit 1
          fi

  # Publishing. Only for a push to main, only after `build` (and so every
  # test) has passed, and only when something that is published changed.
  # Each calls the workflow that does the work, which can also be run by hand.
  # They are given the permissions they need here and nowhere else: nothing
  # that runs for a pull request can publish.
  deploy:
    name: Publish site
    needs: [changes, build]
    if: github.event_name == 'push' && needs.build.result == 'success' && needs.changes.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  docker:
    name: Publish image
    needs: [changes, build]
    if: github.event_name == 'push' && needs.build.result == 'success' && needs.changes.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
